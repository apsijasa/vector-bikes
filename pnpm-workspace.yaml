# Proyecto único: blueprints/ (el bundle, con su propio workspace/package.json) nunca es un paquete.
packages:
  - "."
  - "!blueprints/**"

# Scripts de instalación permitidos (aprueba el postinstall de esbuild).
allowBuilds:
  esbuild: true

# Excepciones a la antigüedad mínima de publicación para versiones fijadas.
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - resend@6.28.1
  - vitest@5.0.1
